              $ref: '#/components/schemas/PatchedUserRegistrationConfirmationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRegistrationConfirmationRequest'
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
components:
  schemas:
    AcceptInviteRequestRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 8
          description: Password for the invited user account.
          maxLength: 70
        token:
          type: string
          nullable: true
          minLength: 1
          description: Invitation token from the email link.
          maxLength: 70
      required:
      - password
    BlankEnum:
      enum:
      - ''
    ChangePasswordRequest:
      type: object
      properties:
        oldPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 1
      required:
      - newPassword
      - oldPassword
    Controller:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        serialNumber:
          type: string
          description: Unique controller serial number.
          maxLength: 36
        lastAgentStartupAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Last time the controller agent started.
        firmwareVersion:
          type: string
          nullable: true
          description: Current firmware version reported by the controller.
          maxLength: 36
        agentVersion:
          type: string
          nullable: true
          maxLength: 255
        frpcVersion:
          type: string
          nullable: true
          maxLength: 255
        pythonVersion:
          type: string
          nullable: true
          title: Python runtime version
          maxLength: 64
        mqttrpcVersion:
          type: string
          nullable: true
          title: Python3-mqttrpc package version
          maxLength: 255
        pahoMqttVersion:
          type: string
          nullable: true
          title: Python3-paho-mqtt package version
          maxLength: 255
        wbMqttDbVersion:
          type: string
          nullable: true
          title: Wb-mqtt-db package version
          maxLength: 255
        isAgentOk:
          type: boolean
          readOnly: true
          description: Whether the controller agent is currently considered healthy.
        lastAgentPingAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Last successful agent ping time.
        lastMetricsAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Last time metrics were received from the controller.
        metricsEnabled:
          type: boolean
          title: Metrics collection enabled
        metricsSendIntervalSeconds:
          type: integer
          maximum: 240
          minimum: 60
          title: Metrics send interval, seconds
          description: How often the controller sends collected metrics to the cloud.
            In seconds, 60 to 240, 120 by default.
        showMetricsUpdateBanner:
          type: boolean
          readOnly: true
          description: Whether UI should show a warning that the agent must be updated
            for metrics.
        description:
          type: string
          nullable: true
          description: Optional human-readable controller description.
          maxLength: 255
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
          description: Latitude in decimal degrees.
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
          description: Longitude in decimal degrees.
        organization:
          allOf:
          - $ref: '#/components/schemas/SimpleOrganization'
          readOnly: true
          description: Organization that owns the controller.
        group:
          allOf:
          - $ref: '#/components/schemas/Group'
          readOnly: true
          description: Group assigned to the controller.
        userDefinedData:
          type: array
          items:
            $ref: '#/components/schemas/UserDefinedData'
          nullable: true
          title: Custom metadata
          description: Optional user-defined key-value metadata for the controller.
        previewUrl:
          type: string
          format: uri
          readOnly: true
          nullable: true
          description: Preview image URL for the controller model.
        activeTransferRequestId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: Identifier of the active transfer request, if one exists.
      required:
      - activeTransferRequestId
      - group
      - id
      - isAgentOk
      - lastAgentPingAt
      - lastAgentStartupAt
      - lastMetricsAt
      - organization
      - previewUrl
      - serialNumber
      - showMetricsUpdateBanner
      - userDefinedData
    ControllerActivationRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          description: Controller activation token.
        organization:
          type: string
          format: uuid
          description: Organization that the controller should be activated into.
      required:
      - organization
      - token
    ControllerConnection:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        lastPingAt:
          type: string
          format: date-time
          nullable: true
          description: Last time the tunnel connection sent a keepalive ping.
      required:
      - id
    ControllerCount:
      type: object
      properties:
        count:
          type: integer
          title: Controller count
          description: Total number of matching controllers.
        countAgentNotOk:
          type: integer
          title: Controllers with stale agent
          description: Number of matching controllers whose agent is not currently
            healthy.
      required:
      - count
      - countAgentNotOk
    ControllerDiagnostic:
      type: object
      properties:
        status:
          type: string
          readOnly: true
          default: not_requested
        id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created
      - id
      - status
    ControllerGroupSetterRequest:
      type: object
      properties:
        controllers:
          type: array
          items:
            type: string
            minLength: 1
          description: List of controller serial numbers to update.
      required:
      - controllers
    ControllerLastMetricsTime:
      type: object
      properties:
