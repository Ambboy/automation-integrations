      type: object
      properties:
        userEmail:
          type: string
          format: email
          minLength: 1
          description: Email address and username for the new account.
        userPassword:
          type: string
          minLength: 8
          maxLength: 70
      required:
      - userEmail
      - userPassword
    UserSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        ipAddress:
          type: string
          readOnly: true
          nullable: true
        userAgent:
          type: string
          readOnly: true
        country:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        lastActivity:
          type: string
          format: date-time
          readOnly: true
        isCurrent:
          type: boolean
          readOnly: true
      required:
      - city
      - country
      - created
      - id
      - ipAddress
      - isCurrent
      - lastActivity
      - userAgent
    VerifyTOTPOrRecoveryCodeRequest:
      type: object
      properties:
        code:
          type: string
          title: TOTP code
          description: One-time code from the authenticator app.
          maxLength: 6
          minLength: 6
        recoveryCode:
          type: string
          description: Recovery code used instead of a TOTP code.
          maxLength: 25
          minLength: 25
        scope:
          allOf:
          - $ref: '#/components/schemas/ScopeEnum'
          description: |-
            Scope of the protected action.

            * `transfer_controller` - Transfer controller to another organization
            * `delete_controller` - Delete controller from organization
            * `delete_organization` - Delete organization
            * `change_password` - Change user password
            * `disable_user_totp` - Disable TOTP Auth for user
            * `change_org_totp` - Change TOTP Required in organization
            * `verify_email_totp` - Verify email set or change for user
      required:
      - scope
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
tags:
- name: Authentication
  description: Sign-in, session tokens, password reset and TOTP verification.
- name: Users
  description: Current user profile, registration requests and email verification.
- name: Organizations
  description: Organizations, members, invites and organization-level settings.
- name: Groups
  description: Controller groups, hierarchy and controller assignment.
- name: Controllers
  description: Controller inventory, activation, diagnostics, tunnels and system metrics.
- name: Controller Transfers
  description: Transfer controllers between organizations, including request validation
    and acceptance.
- name: Grafana
  description: Grafana access and session bootstrap.
- name: Environment
  description: Public environment metadata for client applications.
