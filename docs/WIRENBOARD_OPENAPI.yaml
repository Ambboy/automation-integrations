          type: string
          format: date-time
          nullable: true
          description: Time of the newest metric point stored for the controller.
      required:
      - lastMetricsAt
    ControllerService:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        port:
          type: integer
          description: Service port on the controller; identifies the service.
        name:
          type: string
          description: Button label override; defaults to the port.
          maxLength: 64
        displayName:
          type: string
          readOnly: true
          description: Button label (override or the port number).
      required:
      - displayName
      - id
      - port
    ControllerServiceRequest:
      type: object
      properties:
        port:
          type: integer
          description: Service port on the controller; identifies the service.
        name:
          type: string
          description: Button label override; defaults to the port.
          maxLength: 64
      required:
      - port
    ControllerSystemMetricsRequest:
      type: object
      properties:
        start:
          type: string
          format: date-time
          title: Start time
          description: Start of the metrics time range.
        stop:
          type: string
          format: date-time
          title: End time
          description: End of the metrics time range.
        name:
          allOf:
          - $ref: '#/components/schemas/NameEnum'
          description: |-
            Logical name of the system metric.

            * `disk_free_data` - disk_free_data
            * `disk_free_root` - disk_free_root
            * `load15` - load15
            * `mem_available` - mem_available
      required:
      - name
      - start
      - stop
    ControllerSystemMetricsValues:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        value:
          type: string
          nullable: true
          description: Represent metric value compactly for frontend graph widgets.
          readOnly: true
      required:
      - timestamp
      - value
    ControllerTcpTunnel:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        connection:
          allOf:
          - $ref: '#/components/schemas/ControllerConnection'
          description: Tunnel connection details.
        connectedAt:
          type: string
          format: date-time
          nullable: true
          description: Time when the TCP tunnel was established.
        protocol:
          nullable: true
          description: |-
            Built-in tunnel type (ssh/http); empty for user services.

            * `ssh` - ssh
            * `http` - http
          oneOf:
          - $ref: '#/components/schemas/ProtocolEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        localPort:
          type: integer
          maximum: 2147483647
          minimum: 0
          default: 80
          description: Service port on the controller.
      required:
      - connection
      - id
    ControllerTransferAcceptRequest:
      type: object
      properties:
        targetOrganizationId:
          type: string
          format: uuid
          description: Organization that will receive the controllers.
        token:
          type: string
          minLength: 1
          description: Controller transfer request token.
      required:
      - targetOrganizationId
      - token
    ControllerTransferValidationRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          description: Controller transfer request token.
      required:
      - token
    ControllerTunnelAccess:
      type: object
      properties:
        tunnel:
          allOf:
          - $ref: '#/components/schemas/ControllerTcpTunnel'
