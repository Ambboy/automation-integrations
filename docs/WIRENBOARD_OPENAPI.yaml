        verificationRequestId:
          type: string
          format: uuid
          description: Identifier of the email verification request to confirm.
    PatchedUserRegistrationConfirmationRequest:
      type: object
      properties:
        registrationRequestId:
          type: string
          format: uuid
          description: Identifier of the registration request to confirm.
    ProtocolEnum:
      enum:
      - ssh
      - http
      type: string
      description: |-
        * `ssh` - ssh
        * `http` - http
    RequestResetPasswordResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    ResetPasswordConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
          description: UID of the user.
        token:
          type: string
          minLength: 1
          title: Reset token
          description: Password reset token from the email link.
        newPassword:
          type: string
          minLength: 1
      required:
      - newPassword
      - token
      - uid
    ResetPasswordConfirmResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    ScopeEnum:
      enum:
      - transfer_controller
      - delete_controller
      - delete_organization
      - change_password
      - disable_user_totp
      - change_org_totp
      - verify_email_totp
      type: string
      description: |-
        * `transfer_controller` - Transfer controller to another organization
        * `delete_controller` - Delete controller from organization
        * `delete_organization` - Delete organization
        * `change_password` - Change user password
        * `disable_user_totp` - Disable TOTP Auth for user
        * `change_org_totp` - Change TOTP Required in organization
        * `verify_email_totp` - Verify email set or change for user
    ServiceCatalogEntry:
      type: object
      properties:
        port:
          type: integer
          description: Default port of the catalog service.
        name:
          type: string
          description: Default button label.
      required:
      - name
      - port
    SetupTOTPResponse:
      type: object
      properties:
        secret:
          type: string
          title: Shared secret
          description: Base32-encoded secret for the authenticator.
        uri:
          type: string
          title: otpauth URI
          description: URI that can be imported into an authenticator app.
        qrCode:
          type: string
          description: QR code image encoded as a string.
      required:
      - qrCode
      - secret
      - uri
    SimpleOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        totpRequired:
          type: boolean
          title: OTP Code required
      required:
      - id
    SimpleUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          description: Email address must be unique and match username
          maxLength: 254
        firstName:
          type: string
          maxLength: 150
        lastName:
          type: string
          maxLength: 150
        totpEnabled:
          type: boolean
          readOnly: true
          description: Whether TOTP is enabled for the user.
        hasRecoveryCodes:
          type: boolean
          readOnly: true
          description: Whether the user has active recovery codes.
      required:
      - email
      - hasRecoveryCodes
      - id
      - totpEnabled
      - username
    StatusEnum:
      enum:
      - pending
      - accepted
      - cancelled
      type: string
      description: |-
        * `pending` - Pending
        * `accepted` - Accepted
        * `cancelled` - Cancelled
    TOTPCodeRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 6
          title: TOTP code
          description: One-time code from the authenticator app.
          maxLength: 6
      required:
      - code
    Tariff:
      type: object
      properties:
        id:
          type: string
          format: uuid
          title: Tariff ID
          description: Unique tariff identifier.
        name:
          type: string
          title: Tariff name
          description: Human-readable tariff name.
        retentionDays:
          type: integer
          description: Metrics retention period included in the tariff, in days.
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          title: Price per controller
          description: Monthly price per controller.
        currencyCode:
          type: string
          description: ISO 4217 currency code.
          maxLength: 3
      required:
      - currencyCode
      - id
      - name
      - price
      - retentionDays
    TariffListResponse:
      type: object
      properties:
        controllersCount:
          type: integer
          title: Current controller count
          description: Current number of controllers in the organization.
        tariffs:
          type: array
          items:
            $ref: '#/components/schemas/Tariff'
          title: Available tariffs
          description: Tariff options available for the organization.
      required:
      - controllersCount
      - tariffs
    TerminateSessionsRequest:
      type: object
      properties:
        sessionIds:
          type: array
          items:
            type: string
            format: uuid
          description: List of session UUIDs to terminate.
          minItems: 1
      required:
      - sessionIds
    TerminateSessionsResponse:
      type: object
      properties:
        detail:
          type: string
        terminatedCount:
          type: integer
      required:
      - detail
      - terminatedCount
    TokenObtainPairWithProperMessage:
      type: object
      properties:
        access:
          type: string
          readOnly: true
          description: JWT access token.
        refresh:
          type: string
          readOnly: true
          description: JWT refresh token.
        totpCode:
          type: string
          description: One-time code from the authenticator app.
          maxLength: 6
          minLength: 6
        recoveryCode:
          type: string
          description: Recovery code used when TOTP is unavailable.
          maxLength: 25
          minLength: 25
      required:
      - access
      - refresh
    TokenObtainPairWithProperMessageRequest:
      type: object
      properties:
        totpCode:
          type: string
          description: One-time code from the authenticator app.
          maxLength: 6
          minLength: 6
        recoveryCode:
          type: string
          description: Recovery code used when TOTP is unavailable.
          maxLength: 25
          minLength: 25
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    TransferRequestController:
      type: object
      description: Lightweight controller serializer for transfer request responses
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        serialNumber:
          type: string
          maxLength: 36
      required:
      - id
      - serialNumber
    UpdateController:
      type: object
      properties:
        description:
          type: string
          nullable: true
          description: Optional human-readable controller description.
          maxLength: 255
        group:
          type: string
          format: uuid
          nullable: true
          description: Group assigned to the controller.
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
          description: Latitude in decimal degrees.
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
          description: Longitude in decimal degrees.
        userDefinedData:
          type: array
          items:
            $ref: '#/components/schemas/UserDefinedData'
          nullable: true
          title: Custom metadata
          description: Optional user-defined key-value metadata for the controller.
          maxItems: 100
        metricsEnabled:
          type: boolean
          title: Metrics collection enabled
        metricsSendIntervalSeconds:
          type: integer
          maximum: 240
          minimum: 60
          title: Metrics send interval, seconds
          description: How often the controller sends collected metrics to the cloud.
            In seconds, 60 to 240, 120 by default.
      required:
      - userDefinedData
    UpdateControllerRequest:
      type: object
      properties:
        description:
          type: string
          nullable: true
          description: Optional human-readable controller description.
          maxLength: 255
        group:
          type: string
          format: uuid
          nullable: true
          description: Group assigned to the controller.
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
          description: Latitude in decimal degrees.
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
          description: Longitude in decimal degrees.
        userDefinedData:
          type: array
          items:
            $ref: '#/components/schemas/UserDefinedDataRequest'
          nullable: true
          title: Custom metadata
          description: Optional user-defined key-value metadata for the controller.
          maxItems: 100
        metricsEnabled:
          type: boolean
          title: Metrics collection enabled
        metricsSendIntervalSeconds:
          type: integer
          maximum: 240
          minimum: 60
          title: Metrics send interval, seconds
          description: How often the controller sends collected metrics to the cloud.
            In seconds, 60 to 240, 120 by default.
      required:
      - userDefinedData
    UpdateGroup:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        parent:
          type: string
          format: uuid
          nullable: true
          description: Parent group. Leave empty to create a top-level group.
      required:
      - name
    UpdateGroupRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        parent:
          type: string
          format: uuid
          nullable: true
          description: Parent group. Leave empty to create a top-level group.
      required:
      - name
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        firstName:
          type: string
          maxLength: 150
        lastName:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          description: Email address must be unique and match username
          maxLength: 254
        remoteAddr:
          type: string
          readOnly: true
          description: IP address of the current request.
        totpEnabled:
          type: boolean
          readOnly: true
          description: Whether TOTP is enabled for the user.
        hasRecoveryCodes:
          type: boolean
          readOnly: true
          description: Whether the user has active recovery codes.
        hasTotpRequiredOrg:
          type: boolean
          readOnly: true
          description: Whether the user belongs to any organization that requires
            TOTP.
        isDemo:
          type: boolean
          readOnly: true
          description: Whether the user is a demo user in any organization.
      required:
      - email
      - hasRecoveryCodes
      - hasTotpRequiredOrg
      - id
      - isDemo
      - remoteAddr
      - totpEnabled
      - username
    UserChangeEmailRequestRequest:
      type: object
      properties:
        newUserEmail:
          type: string
          format: email
          minLength: 1
          description: New email address to verify and attach to the account.
          maxLength: 254
        isPrimary:
          type: boolean
          description: Whether the new email should become the primary email address.
      required:
      - isPrimary
      - newUserEmail
    UserDefinedData:
      type: object
      description: Became a JSON
      properties:
        label:
          type: string
          description: Metadata key shown to users.
          maxLength: 255
        value:
          type: string
          description: Metadata value shown to users.
          maxLength: 1024
      required:
      - label
      - value
    UserDefinedDataRequest:
      type: object
      description: Became a JSON
      properties:
        label:
          type: string
          minLength: 1
          description: Metadata key shown to users.
          maxLength: 255
        value:
          type: string
          minLength: 1
          description: Metadata value shown to users.
          maxLength: 1024
      required:
      - label
      - value
