        tunnelKey:
          type: string
          nullable: true
          description: Tunnel access key, if required by the selected protocol.
        tunnelRedirectUrl:
          type: string
          nullable: true
          description: Direct URL for opening the tunnel in a browser, when applicable.
      required:
      - tunnel
      - tunnelKey
      - tunnelRedirectUrl
    ControllerValidatedToken:
      type: object
      properties:
        controllerSerialNumber:
          type: string
          description: Serial number extracted from the validated activation token.
      required:
      - controllerSerialNumber
    ControllerValidationRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
