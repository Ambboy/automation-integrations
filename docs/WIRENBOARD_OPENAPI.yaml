openapi: 3.0.3
info:
  title: WBC API
  version: 0.0.0 (v1)
  description: REST API for Wiren Board Cloud.
paths:
  /api/v1/auth/logout/:
    post:
      operationId: authLogoutCreate
      description: Invalidate the current refresh token and clear authentication cookies.
      summary: Log out
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotRequiredTokenBlacklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotRequiredTokenBlacklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotRequiredTokenBlacklistRequest'
      responses:
        '200':
          description: No response body
  /api/v1/auth/password/change/:
    put:
      operationId: authPasswordChangeUpdate
      description: Change the password for the current authenticated user. All other
        sessions are automatically terminated.
      summary: Change password
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/password/reset/:
    post:
      operationId: authPasswordResetCreate
      description: Send a password reset email for the specified account.
      summary: Request password reset
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResetPasswordResponse'
          description: ''
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: authPasswordResetConfirmCreate
      description: Set a new password using a valid password reset token.
      summary: Confirm password reset
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPasswordConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordConfirmRequest'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordConfirmResponse'
          description: ''
  /api/v1/auth/sessions/:
    get:
      operationId: authSessionsList
      description: Return all active sessions for the current user with device information.
      summary: List active sessions
      tags:
      - Authentication
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSession'
          description: ''
  /api/v1/auth/sessions/terminate/:
    post:
      operationId: authSessionsTerminateCreate
      description: Terminate specific sessions by their IDs. The current session cannot
        be terminated through this endpoint.
      summary: Terminate sessions
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminateSessionsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TerminateSessionsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TerminateSessionsRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminateSessionsResponse'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: authTokenCreate
      description: Authenticate a user and issue access and refresh tokens.
      summary: Sign in
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairWithProperMessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairWithProperMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairWithProperMessageRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPairWithProperMessage'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: authTokenRefreshCreate
      description: Issue a new access token from a valid refresh token.
      summary: Refresh access token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelayBlacklistTokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DelayBlacklistTokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DelayBlacklistTokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelayBlacklistTokenRefresh'
          description: ''
  /api/v1/auth/totp/activate/:
    post:
      operationId: authTotpActivateCreate
      description: Complete TOTP activation and issue recovery codes. All other sessions
        are automatically terminated.
      summary: Activate TOTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TOTPCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TOTPCodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TOTPCodeRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: TOTP is activated.
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: TOTP set up is not completed.
          description: ''
  /api/v1/auth/totp/disable/:
    post:
      operationId: authTotpDisableCreate
      description: Disable TOTP for the current user after recent confirmation.
      summary: Disable TOTP
      tags:
      - Authentication
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: TOTP is disabled.
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: TOTP is already disabled.
          description: ''
  /api/v1/auth/totp/setup/:
    post:
      operationId: authTotpSetupCreate
      description: Generate the TOTP secret, otpauth URI and QR code for the current
        user.
      summary: Start TOTP setup
      tags:
      - Authentication
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupTOTPResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: TOTP is already enabled.
          description: ''
  /api/v1/auth/totp/verify/:
    post:
      operationId: authTotpVerifyCreate
      description: Verify a TOTP or recovery code for a protected action scope. Provide
        either `code` or `recoveryCode`.
      summary: Verify TOTP or recovery code
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyTOTPOrRecoveryCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyTOTPOrRecoveryCodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyTOTPOrRecoveryCodeRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: TOTP code is verified.
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: TOTP is not enabled.
          description: ''
  /api/v1/controllers/:
    get:
      operationId: controllersList
      description: Return controllers available to the current user.
      summary: List controllers
      parameters:
      - in: query
        name: description
        schema:
          type: string
        description: Description contains
      - in: query
        name: firmware_version
        schema:
          type: string
        description: Firmware version contains
      - in: query
        name: group_ids
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Comma-separated list of group IDs. Includes nested subgroups.
        explode: false
        style: form
      - in: query
        name: group_name
        schema:
          type: string
        description: Group name contains
      - in: query
        name: latitude_max
        schema:
          type: number
          format: double
        description: Maximum latitude in decimal degrees.
      - in: query
        name: latitude_min
        schema:
          type: number
          format: double
        description: Minimum latitude in decimal degrees.
      - in: query
        name: longitude_max
        schema:
          type: number
          format: double
        description: Maximum longitude in decimal degrees.
      - in: query
        name: longitude_min
        schema:
          type: number
          format: double
        description: Minimum longitude in decimal degrees.
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: organization_id
        schema:
          type: string
          format: uuid
        description: Filter controllers by organization ID.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search across controller description, serial number, firmware
          version and group name.
      - in: query
        name: serial_number
        schema:
          type: string
        description: Serial number contains
      tags:
      - Controllers
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedControllerList'
          description: ''
  /api/v1/controllers-activation/activate/:
    post:
      operationId: activateController
      description: Attach a controller to an organization using an activation token.
      summary: Activate controller
      tags:
      - Controllers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControllerActivationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ControllerActivationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ControllerActivationRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Controller'
          description: ''
  /api/v1/controllers-activation/validate/:
    post:
      operationId: validateControllerActivationToken
      description: Validate a controller activation token before activation.
      summary: Validate controller activation token
      tags:
      - Controllers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControllerValidationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ControllerValidationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ControllerValidationRequest'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerValidatedToken'
          description: ''
  /api/v1/controllers-count/:
    get:
      operationId: getControllerCounters
      description: Return total controller count and agent health counters for the
        current filters.
      summary: Get controller counters
      tags:
      - Controllers
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerCount'
          description: ''
  /api/v1/controllers-transfer-request/accept/:
    post:
      operationId: acceptControllerTransferRequest
      description: Accept a pending controller transfer request into the selected
        organization.
      summary: Accept controller transfer request
      tags:
      - Controller Transfers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControllerTransferAcceptRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ControllerTransferAcceptRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ControllerTransferAcceptRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Controller'
          description: ''
  /api/v1/controllers-transfer-request/validate/:
    post:
      operationId: validateControllerTransferRequest
      description: Validate that a controller transfer request token is valid for
        the current user.
      summary: Validate controller transfer request
      tags:
      - Controller Transfers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControllerTransferValidationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ControllerTransferValidationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ControllerTransferValidationRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationControllerTransferResponse'
          description: ''
  /api/v1/controllers/{serialNumber}/:
    get:
      operationId: controllersRetrieve
      description: Return details for the selected controller.
      summary: Retrieve controller
      parameters:
      - in: path
        name: serialNumber
        schema:
          type: string
        required: true
      tags:
      - Controllers
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Controller'
          description: ''
    put:
      operationId: controllersUpdate
      description: Replace editable fields of the selected controller.
      summary: Update controller
      parameters:
      - in: path
        name: serialNumber
        schema:
          type: string
        required: true
      tags:
      - Controllers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateControllerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateControllerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateControllerRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateController'
          description: ''
    patch:
      operationId: controllersPartialUpdate
      description: Update one or more editable fields of the selected controller.
      summary: Partially update controller
      parameters:
      - in: path
        name: serialNumber
        schema:
          type: string
        required: true
      tags:
      - Controllers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateControllerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateControllerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateControllerRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateController'
          description: ''
    delete:
      operationId: controllersDestroy
      description: Delete the selected controller.
      summary: Delete controller
      parameters:
      - in: path
        name: serialNumber
        schema:
          type: string
        required: true
      tags:
      - Controllers
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/controllers/{serialNumber}/diagnostic/:
    get:
      operationId: getControllerDiagnostic
      description: Return the latest diagnostic file for the selected controller.
      summary: Get controller diagnostic file
      parameters:
      - in: path
        name: serialNumber
        schema:
          type: string
        required: true
      tags:
      - Controllers
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerDiagnostic'
          description: ''
  /api/v1/controllers/{serialNumber}/last-metrics-time/:
    get:
      operationId: getControllerLastMetricsTime
      description: Return the time of the newest metric point stored for the selected
        controller.
      summary: Get controller last metrics time
      parameters:
      - in: path
        name: serialNumber
        schema:
          type: string
        required: true
      tags:
      - Controllers
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerLastMetricsTime'
          description: ''
  /api/v1/controllers/{serialNumber}/request-diagnostic/:
    post:
      operationId: requestControllerDiagnostics
      description: Trigger diagnostic data collection for the selected controller.
      summary: Request controller diagnostics
      parameters:
      - in: path
        name: serialNumber
        schema:
          type: string
        required: true
      tags:
      - Controllers
      security:
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/controllers/{serialNumber}/service-catalog/:
    get:
      operationId: listServiceCatalog
      description: Return predefined services with default ports for tunneling.
      summary: List service catalog
      parameters:
      - in: path
        name: serialNumber
        schema:
          type: string
        required: true
      tags:
      - Controllers
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceCatalogEntry'
          description: ''
  /api/v1/controllers/{serialNumber}/services/:
    get:
      operationId: listControllerServices
      description: Default ViewSet but without create and delete.
      summary: List controller services
      parameters:
      - in: path
        name: serialNumber
        schema:
          type: string
        required: true
      tags:
      - Controllers
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ControllerService'
          description: ''
    post:
      operationId: addControllerService
      description: Default ViewSet but without create and delete.
      summary: Add a controller service
      parameters:
      - in: path
        name: serialNumber
        schema:
          type: string
        required: true
      tags:
      - Controllers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControllerServiceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ControllerServiceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ControllerServiceRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerService'
          description: ''
  /api/v1/controllers/{serialNumber}/services/{port}/:
    patch:
      operationId: updateControllerService
      description: Default ViewSet but without create and delete.
      summary: Update a controller service
      parameters:
      - in: path
        name: port
        schema:
          type: string
          pattern: '[0-9]{1,5}'
        description: Local port of the configured service.
        required: true
      - in: path
        name: serialNumber
        schema:
          type: string
        required: true
      tags:
      - Controllers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedControllerServiceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedControllerServiceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedControllerServiceRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerService'
          description: ''
    delete:
      operationId: deleteControllerService
      description: Default ViewSet but without create and delete.
      summary: Delete a controller service
      parameters:
      - in: path
        name: port
        schema:
          type: string
          pattern: '[0-9]{1,5}'
        description: Local port of the configured service.
        required: true
      - in: path
        name: serialNumber
        schema:
          type: string
        required: true
      tags:
      - Controllers
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/controllers/{serialNumber}/system-metrics/:
    post:
      operationId: queryControllerSystemMetrics
      description: Return time-series system metrics for the selected controller.
      summary: Query controller system metrics
      parameters:
      - in: path
        name: serialNumber
        schema:
          type: string
        required: true
      tags:
      - Controllers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControllerSystemMetricsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ControllerSystemMetricsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ControllerSystemMetricsRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ControllerSystemMetricsValues'
          description: ''
  /api/v1/controllers/{serialNumber}/tcp-tunnels/{identifier}/:
    post:
      operationId: createControllerTunnel
      description: 'Create or reuse a TCP tunnel to the selected controller service:
        built-in SSH/HomeUI or a user-configured service identified by its port.'
      summary: Create controller tunnel
      parameters:
      - in: path
        name: identifier
        schema:
          type: string
        description: Built-in `ssh`/`http` or the local port of a configured service.
        required: true
      - in: path
        name: serialNumber
        schema:
          type: string
        required: true
      tags:
      - Controllers
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerTunnelAccess'
          description: ''
  /api/v1/email-unsubscribe/:
    get:
      operationId: emailUnsubscribeRetrieve
      description: Redirect to the unsubscribe page for mail clients without one-click
        support.
      summary: Open the unsubscribe page
      tags:
      - Users
      security:
      - {}
      responses:
        '302':
          description: No response body
    post:
      operationId: emailUnsubscribeCreate
      description: Stop sending broadcasts to the address the token was issued for.
      summary: Unsubscribe from broadcasts
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailUnsubscribeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailUnsubscribeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailUnsubscribeRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/environments/:
    get:
      operationId: environmentsRetrieve
      description: Return public runtime settings required by frontend clients.
      summary: Get client environment settings
