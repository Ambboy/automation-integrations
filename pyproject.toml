[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-integrations"
version = "0.1.0"
description = "Durable, local integration service for owner-written extensions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
automation-integrations = "automation_integrations.cli:main"

[tool.setuptools.packages.find]
include = ["automation_integrations*"]
